<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid movie recommender illustration</title>
  <desc id="desc">Movie cards connected through a knowledge graph with AI recommendations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151B3B"/>
      <stop offset="1" stop-color="#261233"/>
    </linearGradient>
    <linearGradient id="poster1" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9955E8"/>
      <stop offset="1" stop-color="#3F2370"/>
    </linearGradient>
    <linearGradient id="poster2" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7BFFAF"/>
      <stop offset="1" stop-color="#1E6950"/>
    </linearGradient>
  </defs>
  <rect width="720" height="400" rx="30" fill="url(#bg)"/>
  <text x="42" y="59" fill="#fff" font-family="Arial, sans-serif" font-size="23" font-weight="700">For you</text>
  <rect x="42" y="84" width="155" height="238" rx="18" fill="url(#poster1)" transform="rotate(-5 119 203)"/>
  <circle cx="116" cy="178" r="42" fill="#CFAAFF" opacity=".45"/>
  <polygon points="107,157 107,199 141,178" fill="#fff"/>
  <text x="66" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">NEBULA</text>
  <rect x="218" y="85" width="155" height="238" rx="18" fill="url(#poster2)" transform="rotate(4 295 204)"/>
  <path d="M246 224c35-80 73-80 104 0" fill="none" stroke="#D7FFE4" stroke-width="9" stroke-linecap="round"/>
  <circle cx="295" cy="166" r="36" fill="#D7FFE4" opacity=".3"/>
  <text x="250" y="278" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">HORIZON</text>
  <g stroke="#6D5D87" stroke-width="3">
    <line x1="458" y1="119" x2="565" y2="95"/>
    <line x1="458" y1="119" x2="508" y2="201"/>
    <line x1="565" y1="95" x2="640" y2="163"/>
    <line x1="508" y1="201" x2="640" y2="163"/>
    <line x1="508" y1="201" x2="577" y2="284"/>
    <line x1="640" y1="163" x2="577" y2="284"/>
  </g>
  <g>
    <circle cx="458" cy="119" r="26" fill="#9955E8"/>
    <circle cx="565" cy="95" r="18" fill="#7BFFAF"/>
    <circle cx="640" cy="163" r="23" fill="#D46AA4"/>
    <circle cx="508" cy="201" r="30" fill="#7BFFAF"/>
    <circle cx="577" cy="284" r="25" fill="#9955E8"/>
